<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>voidbox AR · 조경수목 정보 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#060807;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column;justify-content:space-between;}
  .top{padding:calc(env(safe-area-inset-top) + 14px) 16px 0;display:flex;align-items:center;gap:10px;}
  .brand{background:rgba(8,10,9,.78);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:8px 14px 8px 12px;font-size:12px;display:flex;align-items:center;gap:10px;}
  .brand img{height:16px;display:block}
  .brand span{opacity:.75;border-left:1px solid rgba(255,255,255,.2);padding-left:10px;line-height:1}
  .brand i{width:7px;height:7px;border-radius:50%;background:#37e08a;box-shadow:0 0 8px #37e08a;display:inline-block;}
  .bottom{padding:0 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px;align-items:center;}
  #hint{color:#fff;font-size:13px;background:rgba(8,10,9,.78);backdrop-filter:blur(8px);padding:10px 16px;border-radius:12px;text-align:center;line-height:1.5}
  #tabs{display:none;gap:8px;pointer-events:auto;}
  #tabs button{font-family:inherit;border:1px solid rgba(255,255,255,.25);background:rgba(8,10,9,.78);backdrop-filter:blur(8px);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;}
  #tabs button.on{background:#37e08a;color:#04120a;border-color:#37e08a}
  #loading{position:fixed;inset:0;z-index:20;background:#060807;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:14px}
  #loading .logo img{height:34px}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#37e08a;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .mindar-ui-overlay,.a-enter-vr,.a-enter-ar{display:none!important}
  /* 랜딩 */
  #landing{position:fixed;inset:0;z-index:30;background:radial-gradient(90% 55% at 85% 0%,rgba(55,224,138,.16) 0%,rgba(55,224,138,0) 60%),#060807;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 28px) 28px calc(env(safe-area-inset-bottom) + 28px);}
  #landing .logo img{height:30px;display:block}
  #landing .hero h1{font-size:34px;line-height:1.25;margin:0 0 14px;font-weight:800;letter-spacing:-.01em}
  #landing .hero h1 span{color:#37e08a}
  #landing .hero p{margin:0;color:rgba(255,255,255,.7);font-size:15px;line-height:1.65}
  .steps{display:flex;gap:10px;margin-top:28px}
  .steps div{flex:1;background:#101312;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 12px 14px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.8)}
  .steps b{display:block;color:#37e08a;font-size:18px;margin-bottom:4px}
  #cta{font-family:inherit;width:100%;border:0;border-radius:16px;padding:18px;font-size:17px;font-weight:800;background:#37e08a;color:#04120a;box-shadow:0 8px 30px rgba(55,224,138,.35);display:flex;align-items:center;justify-content:center;gap:10px}
  #cta:active{transform:scale(.98)}
  #cta:disabled{opacity:.6}
  #consent{font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-top:12px;line-height:1.5}
  #consent.err{color:#ffb84d}
  /* 스캔 뷰파인더 */
  #finder{position:fixed;left:50%;top:50%;width:min(72vw,320px);aspect-ratio:1/1;transform:translate(-50%,-56%);pointer-events:none;z-index:5;display:none}
  #finder i{position:absolute;width:34px;height:34px;border:3px solid #37e08a;border-radius:6px}
  #finder i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
  #finder i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
  #finder i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
  #finder i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
  #finder .line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#37e08a,transparent);animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%{top:6%}50%{top:94%}100%{top:6%}}
  #back{font-family:inherit;pointer-events:auto;background:rgba(8,10,9,.78);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;width:36px;height:36px;font-size:18px;display:none;align-items:center;justify-content:center;margin-left:auto}
</style>
</head>
<body>

<div id="loading" style="display:none"><div class="logo"><img src="./assets/full_logo.svg" alt="voidbox"></div><div class="spin"></div><div id="loadmsg">AR 엔진 로딩 중…</div></div>

<div id="landing">
  <div class="logo"><img src="./assets/full_logo.svg" alt="voidbox"></div>
  <div class="hero">
    <h1>수목 정보를<br><span>AR</span>로 확인하세요</h1>
    <p>단지 내 조경수목에 부착된 태그를 스캔하면 수종·생육 데이터·관리 이력을 현장에서 바로 볼 수 있습니다.</p>
    <div class="steps">
      <div><b>1</b>카메라 사용 허용</div>
      <div><b>2</b>수목 태그 비추기</div>
      <div><b>3</b>정보 패널 확인</div>
    </div>
  </div>
  <div>
    <button id="cta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>태그 스캔하기</button>
    <div id="consent">스캔을 시작하면 카메라 사용 권한을 요청합니다.<br>영상은 기기에서만 처리되며 저장·전송되지 않습니다.</div>
  </div>
</div>

<div id="finder"><i></i><i></i><i></i><i></i><div class="line"></div></div>

<div id="ui">
  <div class="top"><div class="brand"><img src="./assets/full_logo.svg" alt="voidbox"><span>조경수목 AR</span><i></i></div><button id="back" title="처음으로">×</button></div>
  <div class="bottom">
    <div id="hint">명함(마커)을 카메라에 비춰주세요</div>
    <div id="tabs">
      <button data-tab="0" class="on">기본 정보</button>
      <button data-tab="1">생육 데이터</button>
      <button data-tab="2">관리 이력</button>
    </div>
  </div>
</div>

<script>
/* ========= 데이터 (데모용) ========= */
const TREE = {
  name:'느티나무', sci:'Zelkova serrata', id:'YC-MD-07-0213',
  site:'목동 7단지 · 중앙광장 남측', planted:'1988년 (수령 약 38년)',
  height:'12.5 m', dbh:'45 cm', crown:'9.8 m', health:87, co2:'32 kg/년',
  growth:{years:['2019','2020','2021','2022','2023','2024','2025'], dbh:[38,39,40.5,41.5,43,44,45], health:[78,80,79,83,85,86,87]},
  history:[
    ['2025.04','수세 진단','건강도 87 · 이상 없음','ok'],
    ['2024.09','태풍 후 점검','가지 2개소 절단 정리','ok'],
    ['2024.06','병해충 방제','흰불나방 예찰 · 친환경 약제','ok'],
    ['2024.03','정기 전정','수형 정리 · 고사지 제거','ok'],
    ['2023.11','토양 개량','유기질 비료 시비','ok'],
  ]
};
const G = {bg:'#0b0d0c', card:'#151817', line:'rgba(255,255,255,.09)', txt:'#ffffff', sub:'rgba(255,255,255,.62)', acc:'#37e08a', acc2:'#7ad7ff', warn:'#ffb84d'};

/* ========= 캔버스 패널 그리기 ========= */
const FONT='"Pretendard Variable",Pretendard,sans-serif';
const LOGO=new Image(); LOGO.src='./assets/full_logo.svg';
// 캔버스는 DOM 텍스트가 아니라 동적 서브셋이 자동 로드되지 않으므로, 패널에 쓰이는 글자를 미리 로드
const FONT_TEXT=JSON.stringify(TREE)+'기본 정보 건강도 양호 현장 촬영 이미지 영역 수고 흉고직경 수관폭 식재년도 위치 CO₂ 흡수량 생육 데이터 최근 7년 성장 추세 ↑ (cm) 지수 / 100 연도별 추이 관리 이력 최근 점검 완료 ✓ 다음 예정 정기 전정 담당 : 양천구 공원녹지과 ID 0123456789.';
const FONT_READY=Promise.all(['400','500','700','800'].map(w=>document.fonts.load(w+' 20px "Pretendard Variable"',FONT_TEXT))).catch(()=>{});
const W=1024, H=720;
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function frame(ctx,title,tag){
  ctx.clearRect(0,0,W,H);
  rr(ctx,0,0,W,H,36); ctx.fillStyle=G.bg; ctx.fill();
  ctx.strokeStyle='rgba(55,224,138,.55)'; ctx.lineWidth=4; ctx.stroke();
  // logo watermark
  if(LOGO.complete&&LOGO.naturalWidth){ctx.globalAlpha=.55; ctx.drawImage(LOGO,W-40-140,H-30-31,140,31); ctx.globalAlpha=1;}
  // header
  ctx.fillStyle=G.acc; rr(ctx,40,36,10,64,5); ctx.fill();
  ctx.fillStyle=G.txt; ctx.font='800 56px '+FONT; ctx.textBaseline='top'; ctx.fillText(TREE.name,70,34);
  ctx.fillStyle=G.sub; ctx.font='italic 26px '+FONT; ctx.fillText(TREE.sci,70,98);
  // tag
  ctx.font='700 24px '+FONT; const tw=ctx.measureText(tag).width+44;
  rr(ctx,W-40-tw,44,tw,48,24); ctx.fillStyle='rgba(55,224,138,.16)'; ctx.fill();
  ctx.strokeStyle=G.acc; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle=G.acc; ctx.fillText(tag,W-40-tw+22,55);
  ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.textAlign='right'; ctx.fillText('ID '+TREE.id,W-40,104); ctx.textAlign='left';
  ctx.strokeStyle=G.line; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(40,150); ctx.lineTo(W-40,150); ctx.stroke();
  // section title
  ctx.fillStyle=G.txt; ctx.font='700 30px '+FONT; ctx.fillText(title,40,176);
}
function drawTreeIcon(ctx,cx,cy,s){
  ctx.fillStyle='#8a5a2b'; rr(ctx,cx-s*.07,cy-s*.05,s*.14,s*.55,s*.04); ctx.fill();
  const blobs=[[0,-.35,.34],[-.28,-.2,.26],[.28,-.2,.26],[-.16,-.5,.22],[.16,-.5,.22],[0,-.12,.28]];
  blobs.forEach(([x,y,r],i)=>{ctx.fillStyle=i%2?'#2fbf72':'#37e08a';ctx.beginPath();ctx.arc(cx+x*s,cy+y*s,r*s,0,7);ctx.fill();});
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(cx-.1*s,cy-.55*s,.12*s,0,7); ctx.fill();
}
function panelInfo(ctx){
  frame(ctx,'기본 정보','건강도 양호');
  // photo card
  rr(ctx,40,224,300,440,24); ctx.fillStyle=G.card; ctx.fill();
  const grd=ctx.createLinearGradient(0,224,0,664); grd.addColorStop(0,'rgba(122,215,255,.12)'); grd.addColorStop(1,'rgba(55,224,138,.05)');
  ctx.fillStyle=grd; ctx.fill();
  drawTreeIcon(ctx,190,470,300);
  ctx.fillStyle=G.sub; ctx.font='20px '+FONT; ctx.textAlign='center'; ctx.fillText('현장 촬영 이미지 영역',190,630); ctx.textAlign='left';
  // stats grid
  const stats=[['수고',TREE.height],['흉고직경',TREE.dbh],['수관폭',TREE.crown],['식재년도',TREE.planted],['위치',TREE.site],['CO₂ 흡수량',TREE.co2]];
  stats.forEach((s,i)=>{const col=i%2, row=Math.floor(i/2); const x=372+col*316, y=224+row*150;
    rr(ctx,x,y,300,132,20); ctx.fillStyle=G.card; ctx.fill();
    ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.fillText(s[0],x+22,y+20);
    ctx.fillStyle=(i==5)?G.acc:G.txt; ctx.font=(s[1].length>10?'700 26px':'700 40px')+' '+FONT; ctx.fillText(s[1],x+22,y+58);
  });
}
function panelGrowth(ctx){
  frame(ctx,'생육 데이터 · 최근 7년','성장 추세 ↑');
  const g=TREE.growth;
  // bar chart DBH
  const x0=90,y0=640,cw=520,ch=380;
  ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.fillText('흉고직경 (cm)',x0-40,222);
  ctx.strokeStyle=G.line; ctx.lineWidth=2;
  for(let i=0;i<=4;i++){const y=y0-ch*i/4; ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+cw,y);ctx.stroke(); ctx.fillStyle=G.sub;ctx.font='18px '+FONT;ctx.textAlign='right';ctx.fillText(String(30+5*i),x0-12,y-9);ctx.textAlign='left';}
  const bw=cw/g.years.length;
  g.years.forEach((yr,i)=>{const v=g.dbh[i]; const h=(v-30)/20*ch; const x=x0+i*bw+bw*.2;
    const bg=ctx.createLinearGradient(0,y0-h,0,y0); bg.addColorStop(0,G.acc); bg.addColorStop(1,'rgba(55,224,138,.25)');
    rr(ctx,x,y0-h,bw*.6,h,8); ctx.fillStyle=bg; ctx.fill();
    ctx.fillStyle=G.txt; ctx.font='700 20px '+FONT; ctx.textAlign='center'; ctx.fillText(v,x+bw*.3,y0-h-28);
    ctx.fillStyle=G.sub; ctx.font='20px '+FONT; ctx.fillText(yr,x+bw*.3,y0+14); ctx.textAlign='left';
  });
  // health line + gauge
  const gx=660,gy=224; rr(ctx,gx,gy,324,440,24); ctx.fillStyle=G.card; ctx.fill();
  ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.fillText('건강도 지수',gx+24,gy+22);
  const cx=gx+162, cy=gy+170, R=95;
  ctx.lineWidth=18; ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI*.75,Math.PI*2.25); ctx.stroke();
  ctx.strokeStyle=G.acc; ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI*.75,Math.PI*.75+Math.PI*1.5*TREE.health/100); ctx.stroke();
  ctx.fillStyle=G.txt; ctx.font='800 64px '+FONT; ctx.textAlign='center'; ctx.fillText(TREE.health,cx,cy-36);
  ctx.fillStyle=G.sub; ctx.font='20px '+FONT; ctx.fillText('/ 100',cx,cy+34); ctx.textAlign='left';
  // sparkline
  ctx.fillStyle=G.sub; ctx.font='20px '+FONT; ctx.fillText('연도별 추이',gx+24,gy+320);
  const sx=gx+24, sy=gy+420, sw=276, sh=60;
  ctx.strokeStyle=G.acc2; ctx.lineWidth=4; ctx.beginPath();
  g.health.forEach((v,i)=>{const x=sx+i*sw/(g.health.length-1), y=sy-(v-70)/20*sh; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
  g.health.forEach((v,i)=>{const x=sx+i*sw/(g.health.length-1), y=sy-(v-70)/20*sh; ctx.fillStyle=G.acc2; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill();});
}
function panelHistory(ctx){
  frame(ctx,'관리 이력','최근 점검 2025.04');
  const x=70, top=232;
  ctx.strokeStyle=G.line; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+14,top); ctx.lineTo(x+14,top+TREE.history.length*84); ctx.stroke();
  TREE.history.forEach((h,i)=>{const y=top+i*84;
    ctx.fillStyle=i?G.card:'rgba(55,224,138,.2)'; rr(ctx,x+50,y-10,860,68,16); ctx.fill();
    ctx.fillStyle=i?G.acc2:G.acc; ctx.beginPath(); ctx.arc(x+14,y+24,i?9:13,0,7); ctx.fill();
    ctx.fillStyle=G.sub; ctx.font='700 22px '+FONT; ctx.fillText(h[0],x+74,y+12);
    ctx.fillStyle=G.txt; ctx.font='700 26px '+FONT; ctx.fillText(h[1],x+200,y+10);
    ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.fillText(h[2],x+420,y+12);
    ctx.fillStyle=G.acc; ctx.font='700 20px '+FONT; ctx.textAlign='right'; ctx.fillText('완료 ✓',x+890,y+14); ctx.textAlign='left';
  });
  ctx.fillStyle=G.sub; ctx.font='22px '+FONT; ctx.fillText('다음 예정 · 2026.03 정기 전정  ·  담당 : 양천구 공원녹지과',70,672);
}
const PANELS=[panelInfo,panelGrowth,panelHistory];

/* ========= A-Frame 컴포넌트: 캔버스 텍스처 패널 ========= */
AFRAME.registerComponent('info-panel',{
  schema:{tab:{default:0}},
  init(){
    this.canvas=document.createElement('canvas'); this.canvas.width=W; this.canvas.height=H;
    this.ctx=this.canvas.getContext('2d');
    this.tex=new THREE.CanvasTexture(this.canvas); this.tex.colorSpace=THREE.SRGBColorSpace; this.tex.anisotropy=8;
    const apply=()=>{const m=this.el.getObject3D('mesh'); if(!m)return; m.material=new THREE.MeshBasicMaterial({map:this.tex,transparent:true}); this.redraw();};
    this.el.addEventListener('object3dset',apply); apply();
    if(!LOGO.complete) LOGO.addEventListener('load',()=>this.redraw(),{once:true});
    FONT_READY.then(()=>this.redraw());
  },
  update(){this.redraw();},
  redraw(){ if(!this.ctx)return; PANELS[this.data.tab](this.ctx); this.tex.needsUpdate=true; }
});

/* ========= 씬 구성 ========= */
const PREVIEW=new URLSearchParams(location.search).has('preview');
const MARKER='./assets/card.mind';   // ← 회사 로고 .mind 파일로 교체

const content=`
  <a-entity id="content" position="0 0 0">
    <!-- 3D 수목 -->
    <a-entity position="-0.62 -0.05 0.02" animation="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear">
      <a-cylinder position="0 0.16 0" radius="0.03" height="0.32" color="#8a5a2b" shader="flat"></a-cylinder>
      <a-sphere position="0 0.42 0" radius="0.17" color="#2fbf72" shader="flat"></a-sphere>
      <a-sphere position="-0.12 0.36 0.05" radius="0.12" color="#37e08a" shader="flat"></a-sphere>
      <a-sphere position="0.12 0.37 -0.04" radius="0.12" color="#37e08a" shader="flat"></a-sphere>
      <a-sphere position="0 0.56 0" radius="0.11" color="#5cf0a8" shader="flat"></a-sphere>
      <a-ring position="0 0.005 0" rotation="-90 0 0" radius-inner="0.22" radius-outer="0.25" color="#37e08a" material="shader:flat;opacity:0.7;transparent:true" animation="property: scale; from: 0.8 0.8 0.8; to: 1.15 1.15 1.15; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine"></a-ring>
    </a-entity>
    <!-- 연결선 -->
    <a-entity line="start: -0.62 0.62 0.02; end: -0.62 0.95 0.02; color:#37e08a"></a-entity>
    <a-entity line="start: -0.62 0.95 0.02; end: -0.25 0.95 0.02; color:#37e08a"></a-entity>
    <!-- 정보 패널 -->
    <a-plane id="panel" info-panel="tab:0" position="0.42 0.62 0.02" width="1.3" height="0.914" rotation="0 -12 0" material="transparent:true"
      animation__in="property: scale; from: 0.6 0.6 0.6; to: 1 1 1; dur: 500; easing: easeOutBack; startEvents: show">
    </a-plane>
    <!-- 바닥 그리드 -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="1.6" height="1.6" material="shader:flat;color:#37e08a;opacity:0.10;transparent:true;wireframe:true;segmentsWidth:1;segmentsHeight:1"></a-plane>
  </a-entity>`;

document.addEventListener('DOMContentLoaded',()=>{
  const scene=document.createElement('a-scene');
  if(PREVIEW){
    scene.setAttribute('background','color:#141716');
    scene.setAttribute('vr-mode-ui','enabled:false');
    scene.innerHTML=`<a-entity camera position="0 0.5 2.6" look-controls="enabled:false"></a-entity>
      <a-entity rotation="-20 0 0" position="-0.15 -0.2 0" scale="0.9 0.9 0.9">${content}</a-entity>`;
  }else{
    scene.setAttribute('mindar-image',`imageTargetSrc: ${MARKER}; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.01; maxTrack: 1`);
    scene.setAttribute('color-space','sRGB');
    scene.setAttribute('renderer','colorManagement: true; physicallyCorrectLights: true');
    scene.setAttribute('vr-mode-ui','enabled:false');
    scene.setAttribute('device-orientation-permission-ui','enabled:false');
    scene.innerHTML=`<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0"><a-entity scale="0.85 0.85 0.85">${content}</a-entity></a-entity>`;
  }
  document.body.appendChild(scene);

  const load=document.getElementById('loading'), hint=document.getElementById('hint'), tabs=document.getElementById('tabs');
  const setTab=n=>{document.getElementById('panel').setAttribute('info-panel','tab',n); tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab==n));};
  tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setTab(+b.dataset.tab)));

  const landing=document.getElementById('landing'), finder=document.getElementById('finder'), cta=document.getElementById('cta'), consent=document.getElementById('consent'), back=document.getElementById('back');

  if(PREVIEW){
    landing.style.display='none';
    scene.addEventListener('loaded',()=>{hint.textContent='데스크톱 프리뷰 모드 (카메라 미사용)'; tabs.style.display='flex';});
    return;
  }

  /* ---- 화면 1: 랜딩 → 카메라 동의 → 화면 2: 스캔 ---- */
  let sceneLoaded=false; scene.addEventListener('loaded',()=>sceneLoaded=true);
  const waitLoaded=()=>sceneLoaded?Promise.resolve():new Promise(r=>scene.addEventListener('loaded',r,{once:true}));

  cta.addEventListener('click',async()=>{
    cta.disabled=true; consent.classList.remove('err'); consent.textContent='카메라 권한을 확인하는 중…';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      consent.classList.add('err'); consent.textContent='이 브라우저에서는 카메라를 사용할 수 없습니다. Safari 또는 Chrome으로 열어주세요.'; cta.disabled=false; return;
    }
    try{
      // 사용자 제스처 직후 권한 요청 → 브라우저 동의 팝업
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
      st.getTracks().forEach(t=>t.stop());
    }catch(e){
      consent.classList.add('err');
      consent.textContent=(e&&e.name==='NotAllowedError')?'카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용한 뒤 다시 시도해주세요.':'카메라를 열 수 없습니다 ('+(e&&e.name||'오류')+'). HTTPS 접속인지 확인해주세요.';
      cta.disabled=false; return;
    }
    landing.style.display='none'; load.style.display='flex'; document.getElementById('loadmsg').textContent='AR 카메라를 준비하는 중…';
    await waitLoaded();
    try{ await scene.systems['mindar-image-system'].start(); }
    catch(e){ document.getElementById('loadmsg').textContent='AR 엔진을 시작하지 못했습니다. 새로고침 후 다시 시도해주세요.'; }
  });

  scene.addEventListener('arReady',()=>{load.style.display='none'; finder.style.display='block'; back.style.display='flex'; hint.textContent='수목 태그를 사각형 안에 맞춰주세요';});
  scene.addEventListener('arError',()=>{document.getElementById('loadmsg').textContent='카메라를 열 수 없습니다. HTTPS 접속 및 카메라 권한을 확인해주세요.';});

  const target=scene.querySelector('#target');
  target.addEventListener('targetFound',()=>{finder.style.display='none'; hint.textContent='수목 정보를 불러왔습니다 · 탭을 눌러 전환'; tabs.style.display='flex'; document.getElementById('panel').emit('show');});
  target.addEventListener('targetLost',()=>{finder.style.display='block'; hint.textContent='태그를 다시 비춰주세요 · 패널은 유지됩니다';});

  back.addEventListener('click',()=>{ try{scene.systems['mindar-image-system'].stop();}catch(e){} location.reload(); });
});
</script>
</body>
</html>
